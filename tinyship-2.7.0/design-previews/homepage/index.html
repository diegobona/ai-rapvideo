<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Rap Video — 三种深色设计方向</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0d10;color:#f1f1ee;font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif}button,a{-webkit-tap-highlight-color:transparent}button{font:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:2px solid #c7d2fe;outline-offset:4px}header{max-width:1560px;margin:auto;padding:28px 36px 18px;display:flex;justify-content:space-between;align-items:flex-end;gap:24px}header p{font-size:11px;letter-spacing:.2em;color:#899198;margin:0 0 12px}h1{font-size:25px;letter-spacing:-.05em;font-weight:500;margin:0}header .note{font-size:12px;color:#899198;letter-spacing:0;line-height:1.7;margin:0}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:1560px;margin:auto;padding:0 36px 18px}.choice{text-align:left;color:#aaaeb5;border:1px solid #2a2e33;border-radius:8px;background:#111418;padding:17px 20px;transition:background .15s,border-color .15s}.choice[aria-selected="true"]{border-color:#d0d2cd;background:#1d2125;color:#fff}.choice .label{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:10px}.choice strong{font-weight:500;font-size:15px}.choice .code{font-size:10px;letter-spacing:.15em;color:#899198}.choice small{font-size:12px;line-height:1.7}.swatches{display:flex;gap:4px}.swatches i{width:12px;height:12px;border-radius:50%;border:1px solid #ffffff25}.controls{max-width:1560px;margin:auto;padding:0 36px 14px;display:flex;justify-content:space-between;align-items:center;gap:12px;color:#a4acb5;font-size:12px}.view-controls{display:flex;gap:4px}.view-controls button{border:0;color:#8b959e;background:transparent;border-radius:4px;padding:8px 14px;font-size:12px}.view-controls button[aria-pressed="true"]{color:#fff;background:#262c32}.controls a{color:#d2d5d9;text-decoration:none;padding:8px 0}.controls a:hover{text-decoration:underline}.canvas{padding:0 24px 24px;background:#0b0d10}.frame-wrap{max-width:1512px;margin:auto;border:1px solid #33383d;border-radius:10px;overflow:hidden;background:#171b20;transition:max-width .25s}.frame-wrap.mobile{max-width:390px}iframe{display:block;width:100%;height:calc(100vh - 260px);min-height:620px;border:0;background:#171b20}.status{font-size:11px;color:#838c94;line-height:1.5}.explain{max-width:1560px;margin:auto;padding:0 36px 24px;color:#8c969e;font-size:12px}@media(max-width:700px){header{padding:22px 18px 16px;align-items:flex-start}header .note{display:none}.choices{padding:0 18px 14px;gap:7px}.choice{padding:12px 10px}.choice .code,.choice small,.swatches{display:none}.choice .label{margin:0}.choice strong{font-size:12px}.controls{padding:0 18px 14px}.status{max-width:150px}.canvas{padding:0 10px 16px}iframe{height:calc(100vh - 230px);min-height:550px}.explain{padding:0 18px 20px}}
</style>
</head>
<body>
<header><div><p>AI RAP VIDEO / DESIGN EXPLORATION</p><h1>同一个产品，三种深色表达。</h1></div><p class="note">先选气质，再打磨细节。<br>这是独立设计预览，正式站保持现状。</p></header>
<div class="choices" role="tablist" aria-label="设计方向">
<button class="choice" id="tab-a" role="tab" aria-selected="false" aria-controls="design-panel" data-design="a"><span class="label"><strong>A · 黑金编辑风</strong><span class="swatches"><i style="background:#191714"></i><i style="background:#bba789"></i><i style="background:#eee9df"></i></span></span><small>暖黑 × 香槟色 · 优雅衬线 · 画册式留白</small></button>
<button class="choice" id="tab-b" role="tab" aria-selected="true" aria-controls="design-panel" data-design="b"><span class="label"><strong>B · 石墨录音室</strong><span class="swatches"><i style="background:#111413"></i><i style="background:#d0e4c0"></i><i style="background:#edeee8"></i></span></span><small>石墨黑 × 浅鼠尾草 · 窄体标题 · 专业控制台</small></button>
<button class="choice" id="tab-c" role="tab" aria-selected="false" aria-controls="design-panel" data-design="c"><span class="label"><strong>C · 午夜电影感</strong><span class="swatches"><i style="background:#090f1b"></i><i style="background:#5087ff"></i><i style="background:#f0f3f7"></i></span></span><small>深海蓝 × 冰蓝 · 几何无衬线 · 清晰工作台</small></button>
</div>
<div class="controls"><div class="view-controls" aria-label="预览宽度"><button type="button" aria-pressed="true" data-width="desktop">桌面</button><button type="button" aria-pressed="false" data-width="mobile">手机</button></div><span class="status" id="type-note">Barlow Condensed + Manrope</span><a id="open-design" href="b-studio.html" target="_blank" rel="noopener">独立打开 ↗</a></div>
<main class="canvas" id="design-panel" role="tabpanel" aria-labelledby="tab-b"><div class="frame-wrap" id="frame-wrap"><iframe id="design" src="b-studio.html" title="B · 石墨录音室设计预览"></iframe></div></main>
<p class="explain">点击 A / B / C 切换整页；可滚动查看工具、示例、使用步骤和定价。按钮仅演示交互，不调用生成或支付服务。</p>
<script>
const designs={a:{src:'a-editorial.html',name:'A · 黑金编辑风',fonts:'Instrument Serif + Manrope'},b:{src:'b-studio.html',name:'B · 石墨录音室',fonts:'Barlow Condensed + Manrope'},c:{src:'c-midnight.html',name:'C · 午夜电影感',fonts:'Space Grotesk + DM Sans'}};
function setDesign(key){const item=designs[key];if(!item)return;document.querySelectorAll('[data-design]').forEach(button=>button.setAttribute('aria-selected',String(button.dataset.design===key)));document.getElementById('design').src=item.src;document.getElementById('design').title=item.name;document.getElementById('open-design').href=item.src;document.getElementById('type-note').textContent=item.fonts;document.getElementById('design-panel').setAttribute('aria-labelledby','tab-'+key);history.replaceState(null,'','#'+key)}
document.querySelectorAll('[data-design]').forEach(button=>button.addEventListener('click',()=>setDesign(button.dataset.design)));
document.querySelector('[role="tablist"]').addEventListener('keydown',event=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(event.key))return;event.preventDefault();const buttons=[...document.querySelectorAll('[data-design]')],index=buttons.indexOf(document.activeElement),next=event.key==='Home'?0:event.key==='End'?2:(index+(event.key==='ArrowRight'?1:2))%3;buttons[next].focus();setDesign(buttons[next].dataset.design)});
document.querySelectorAll('[data-width]').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('[data-width]').forEach(other=>other.setAttribute('aria-pressed',String(other===button)));document.getElementById('frame-wrap').classList.toggle('mobile',button.dataset.width==='mobile')}));
if(designs[location.hash.slice(1)])setDesign(location.hash.slice(1));
</script>
</body></html>
